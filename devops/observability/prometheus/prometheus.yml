global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    # honor_labels: without this, the scraped sample's own `job` label (e.g. "auth", "gateway" —
    # set from each app's OTEL_SERVICE_NAME via the collector's Prometheus exporter) collides with
    # this scrape job's name and gets silently renamed to `exported_job`. Every query/dashboard
    # written the obvious way (job="auth") would match nothing. honor_labels lets the sample's own
    # label win.
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

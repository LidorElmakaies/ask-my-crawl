services:
  otel-collector:
    # Pinned, not :latest — see the tempo entry below for why this matters concretely, not just
    # in the abstract.
    image: otel/opentelemetry-collector-contrib:0.159.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"    # OTLP gRPC receiver (apps send here)
      - "4318:4318"    # OTLP HTTP receiver (apps send here)
      - "8889:8889"    # Prometheus scrape endpoint
      - "13133:13133"  # Health check
    depends_on:
      - loki
      - tempo
    restart: unless-stopped
    networks:
      - observability
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  loki:
    image: grafana/loki:3.7.6
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml:ro
      - ./data/loki:/loki
    ports:
      - "3100:3100"
    restart: unless-stopped
    networks:
      - observability
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      # Tempo's metrics_generator (service-graphs/span-metrics, see tempo/config.yaml) remote-writes
      # here. Without this flag it 404s continuously the moment real traces start arriving.
      - "--web.enable-remote-write-receiver"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./data/prometheus:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - observability
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  tempo:
    # Pinned — :latest silently drifted to Tempo 3.0 at some point, which restructured the
    # top-level config schema (ingester/compactor top-level keys no longer exist; 3.x moved to a
    # Kafka-backed live_store/block_builder/backend_scheduler architecture). tempo/config.yaml
    # here is written for the 2.x "monolithic, local storage, no Kafka" schema on purpose — this
    # pin keeps that valid instead of chasing 3.x's architecture. Confirmed 2.10.8 (latest 2.x,
    # still receiving security patches) starts cleanly against the existing config unchanged.
    image: grafana/tempo:2.10.8
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./tempo/config.yaml:/etc/tempo/config.yaml:ro
      - ./data/tempo:/var/tempo
    ports:
      - "3200:3200"   # Tempo HTTP API (Grafana queries here)
    restart: unless-stopped
    networks:
      - observability
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:13.2.0
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./data/grafana:/var/lib/grafana
    ports:
      # Host port 3001, not 3000 — an unrelated process on the dev machine already holds host
      # :3000 (confirmed via `Get-Process` before remapping, not touched/killed). Container's own
      # port stays 3000 internally; only the host-side mapping changed.
      - "3001:3000"   # External dashboard access — http://localhost:3001
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - loki
      - prometheus
      - tempo
    restart: unless-stopped
    networks:
      - observability
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  observability:
    driver: bridge
    # Pinned name (compose would otherwise prefix it with the project name, i.e.
    # `observability_observability`). This stack OWNS the network; devops/docker-compose.yml
    # attaches to it as `external: true, name: observability` so the app services can reach
    # otel-collector:4317. Renaming this breaks that join.
    name: observability

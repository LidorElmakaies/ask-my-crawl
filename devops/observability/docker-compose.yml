services:
  otel-collector:
    # Pinned, not :latest — see the tempo entry below for why this matters concretely, not just
    # in the abstract.
    image: otel/opentelemetry-collector-contrib:0.159.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"    # OTLP gRPC receiver (apps send here)
      - "4318:4318"    # OTLP HTTP receiver (apps send here)
      - "8889:8889"    # Prometheus scrape endpoint
      - "13133:13133"  # Health check
    depends_on:
      - loki
      - tempo
    restart: unless-stopped
    networks:
      - observability
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  loki:
    image: grafana/loki:3.7.6
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml:ro
      - ./data/loki:/loki
    ports:
      - "3100:3100"
    restart: unless-stopped
    networks:
      - observability
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      # Tempo's metrics_generator (service-graphs/span-metrics, see tempo/config.yaml) remote-writes
      # here. Without this flag it 404s continuously the moment real traces start arriving.
      - "--web.enable-remote-write-receiver"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./data/prometheus:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - observability
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  tempo:
    # Pinned — :latest silently drifted to Tempo 3.0 at some point, which restructured the
    # top-level config schema (ingester/compactor top-level keys no longer exist; 3.x moved to a
    # Kafka-backed live_store/block_builder/backend_scheduler architecture). tempo/config.yaml
    # here is written for the 2.x "monolithic, local storage, no Kafka" schema on purpose — this
    # pin keeps that valid instead of chasing 3.x's architecture. Confirmed 2.10.8 (latest 2.x,
    # still receiving security patches) starts cleanly against the existing config unchanged.
    image: grafana/tempo:2.10.8
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./tempo/config.yaml:/etc/tempo/config.yaml:ro
      - ./data/tempo:/var/tempo
    ports:
      - "3200:3200"   # Tempo HTTP API (Grafana queries here)
    restart: unless-stopped
    networks:
      - observability
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:13.2.0
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./data/grafana:/var/lib/grafana
    # No host port publish (was "3001:3000") — see docs/planning/02-admin-dashboard-plan.md,
    # Decision 4. Grafana is now reachable only through the Gateway's admin-gated reverse proxy
    # (backend/apps/gateway/src/tool-proxy/), at /admin/grafana on the Gateway's own origin
    # (http://localhost:8000) — a direct host port would let anyone bypass that gate entirely,
    # making "admin-only" an in-app convenience instead of a real boundary. Accepted tradeoff:
    # no more direct localhost:3001 access for local debugging.
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      # Serving from the Gateway's /admin/grafana sub-path (see above) — Grafana needs to know its
      # own mount path or its rendered asset/API links break. With SERVE_FROM_SUB_PATH=true,
      # Grafana expects to keep receiving requests with the /admin/grafana prefix still attached —
      # the Gateway's proxy middleware deliberately does not strip it (see tool-proxy.factory.ts).
      # Deliberately NOT adding GF_SECURITY_ALLOW_EMBEDDING — the Admin Dashboard renders Grafana
      # full-screen via a WebView, never in an iframe, so embedding permission is never needed;
      # don't add it "just in case," it only widens the attack surface for no benefit here.
      #
      # PUBLIC_ORIGIN is the single source of truth for the whole deployment's public origin (see
      # ../.env.example) — this is a *separate* Compose project from devops/, so it needs its own
      # explicit `--env-file ../.env` flag to pick up the same file (see CLAUDE.md's startup
      # sequence); the :- default keeps this working even if that flag is ever forgotten.
      - GF_SERVER_ROOT_URL=${PUBLIC_ORIGIN:-http://localhost:8000}/admin/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    depends_on:
      - loki
      - prometheus
      - tempo
    restart: unless-stopped
    networks:
      - observability
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  observability:
    driver: bridge
    # Pinned name (compose would otherwise prefix it with the project name, i.e.
    # `observability_observability`). This stack OWNS the network; devops/docker-compose.yml
    # attaches to it as `external: true, name: observability` so the app services can reach
    # otel-collector:4317. Renaming this breaks that join.
    name: observability

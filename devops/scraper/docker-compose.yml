services:
  scraper:
    extends:
      file: ../common.yml
      service: _defaults
    build:
      context: ../../backend
      dockerfile: apps/scraper/Dockerfile
    # backend/.env (localhost defaults) is inherited from common.yml's `_defaults` service via
    # `extends:` above — see its comment. ../docker.env layers the container-network overrides
    # this service shares with others (REDIS_URL, SEAWEEDFS_ENDPOINT, KAFKA_BROKERS,
    # OTEL_EXPORTER_OTLP_ENDPOINT, ...) on top; only OTEL_SERVICE_NAME is unique enough to this one
    # service to need its own `environment:` entry.
    env_file:
      - ../docker.env
    environment:
      - OTEL_SERVICE_NAME=scraper
    # No ports: — Kafka-only microservice, no HTTP surface. Same reasoning as job-manager.
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    networks:
      - askmycrawl
      - observability

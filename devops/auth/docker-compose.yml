services:
  auth:
    extends:
      file: ../common.yml
      service: _defaults
    build:
      context: ../../backend
      dockerfile: apps/auth/Dockerfile
    # backend/.env (localhost defaults) is inherited from common.yml's `_defaults` service via
    # `extends:` above — see its comment. ../docker.env layers the container-network overrides
    # this service shares with others (DATABASE_URL, OTEL_EXPORTER_OTLP_ENDPOINT, ...) on top; only
    # OTEL_SERVICE_NAME is unique enough to this one service to need its own `environment:` entry.
    env_file:
      - ../docker.env
    environment:
      - OTEL_SERVICE_NAME=auth
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - askmycrawl
      - observability

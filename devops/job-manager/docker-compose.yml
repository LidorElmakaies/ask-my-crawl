services:
  job-manager:
    extends:
      file: ../common.yml
      service: _defaults
    build:
      context: ../../backend
      dockerfile: apps/job-manager/Dockerfile
    # backend/.env (localhost defaults) is inherited from common.yml's `_defaults` service via
    # `extends:` above — see its comment. ../docker.env layers the container-network overrides
    # this service shares with others (DATABASE_URL, KAFKA_BROKERS, OTEL_EXPORTER_OTLP_ENDPOINT,
    # ...) on top; only OTEL_SERVICE_NAME is unique enough to this one service to need its own
    # `environment:` entry.
    env_file:
      - ../docker.env
    environment:
      - OTEL_SERVICE_NAME=job-manager
    # No ports: — Kafka-only microservice, no HTTP surface. Nothing calls it directly; Gateway's
    # read path for GET /jobs* isn't implemented yet (see docs/specs/services.md), and even once it
    # is, cross-service traffic stays on the shared `askmycrawl` network, not a published host port.
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - askmycrawl
      - observability

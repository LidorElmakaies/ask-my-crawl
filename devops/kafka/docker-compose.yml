services:
  kafka:
    extends:
      file: ../common.yml
      service: _defaults
    # Official apache/kafka image, KRaft mode (no Zookeeper) — decided in .claude/agents/devops.md,
    # don't switch to Bitnami/Confluent. Pinned to 4.3.1 (latest stable at the time this was built,
    # confirmed via Docker Hub, not guessed) — never `:latest`, see the observability stack's Tempo
    # incident in devops.md for why an image silently drifting onto an incompatible config schema is
    # a real, previously-hit failure mode here, not hygiene.
    #
    # Single node running combined broker+controller roles. Two listeners: PLAINTEXT (19092) for
    # other containers on the `askmycrawl` network — services address it as `kafka:19092` — and
    # PLAINTEXT_HOST (9092) published to the host for local debugging (kcat, etc.), matching the
    # official image's own single-node example. CLUSTER_ID is pinned explicitly (generated once via
    # `kafka-storage.sh random-uuid`, not left to the image's built-in default) because storage is
    # persisted on a volume — an unpinned/regenerated cluster ID on a restart would mismatch
    # already-formatted storage and fail to start.
    image: apache/kafka:4.3.1
    hostname: kafka
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      - KAFKA_LISTENERS=CONTROLLER://:29093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:29093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - CLUSTER_ID=Ce7_-Gn5RayKP8NT08XXBw
      # Single-broker dev setup — every replication factor must be 1, the defaults (3) can't be
      # satisfied with one broker and the broker would reject topic creation otherwise.
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      # Decided in devops.md: topics are created explicitly by `kafka-init` below, matching
      # event-schemas.md's partition table exactly. Auto-creation would silently paper over a
      # missing/misconfigured topic (wrong partition count, picked up implicitly on first publish)
      # instead of failing loudly, so it stays off.
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=false
      - KAFKA_LOG_DIRS=/var/lib/kafka/data
    ports:
      - "9092:9092"
    volumes:
      - ../data/kafka:/var/lib/kafka/data
    networks:
      - askmycrawl
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  kafka-init:
    extends:
      file: ../common.yml
      service: _defaults
    # One-off: creates topics explicitly (kafka-topics.sh --create), matching partition counts from
    # docs/specs/event-schemas.md, then exits. Runs after `kafka` is healthy, not just started —
    # kafka-topics.sh would otherwise race the broker's own startup. `restart: "no"` overrides the
    # shared default below — this is a one-off job, not a long-running service.
    #
    # Topics get added here one at a time, alongside whichever piece of the pipeline actually
    # produces/consumes each one (decided 2026-08-20). Job Manager Service (2026-08-28) added five:
    # `job-requests`/`crawl-frontier`/`job-created` it produces, `answer-ready` it consumes (created
    # anyway even though nothing produces it yet — Query/Answer Service isn't built — since
    # `auto.create.topics.enable=false` means a consumer against a missing topic just fails),
    # `result-saved` it produces. The Scraper (2026-08-28, docs/planning/
    # 03-crawler-scraper-indexing-plan.md) adds the remaining two: `crawl-complete` (produced by
    # whichever of the Scraper/Indexer wins the completion race, plan doc §6) and `page-scraped`
    # (Scraper -> Indexer bridge, plan doc §5e) — all seven now created, matching
    # `event-schemas.md`'s table. All replication-factor 1 (single broker) and
    # `retention.ms=86400000` (1 day).
    image: apache/kafka:4.3.1
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - askmycrawl
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        set -e &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists
        --topic job-requests --partitions 3 --replication-factor 1 --config retention.ms=86400000 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists
        --topic crawl-frontier --partitions 6 --replication-factor 1 --config retention.ms=86400000 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists
        --topic job-created --partitions 3 --replication-factor 1 --config retention.ms=86400000 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists
        --topic answer-ready --partitions 3 --replication-factor 1 --config retention.ms=86400000 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists
        --topic result-saved --partitions 3 --replication-factor 1 --config retention.ms=86400000 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists
        --topic crawl-complete --partitions 3 --replication-factor 1 --config retention.ms=86400000 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists
        --topic page-scraped --partitions 6 --replication-factor 1 --config retention.ms=86400000 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --describe

  kafka-ui:
    extends:
      file: ../common.yml
      service: _defaults
    # Web UI for browsing topics/partitions/messages/consumer groups — debugging convenience only,
    # not part of the app stack (no service reads/writes through it). Pinned to v1.5.0, the latest
    # stable release tag at the time this was added, not `:latest` (same discipline as every other
    # image in this file). Points at the in-network `PLAINTEXT` listener, same as every other
    # container on `askmycrawl` — see the `kafka` service above for why that's the right one to use
    # from inside the network vs. `PLAINTEXT_HOST`.
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    environment:
      - KAFKA_CLUSTERS_0_NAME=askmycrawl
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:19092
      # Serving from the Gateway's /admin/kafka-ui sub-path (docs/planning/
      # 02-admin-dashboard-plan.md) — same context-path config kafbat's own example compose file
      # uses (documentation/compose/auth-context.yaml). UNCONFIRMED RISK: a historical GitHub
      # issue on the predecessor project (provectus/kafka-ui#2346) reported the frontend's own
      # client-side routing *ignoring* this exact setting after a refactor. Unknown whether kafbat
      # v1.5.0 still has this bug — must be smoke-tested live once the stack is up (blank page /
      # broken routing under /admin/kafka-ui is the symptom). Fallback if it reproduces: proxy-side
      # path handling in tool-proxy.factory.ts instead of relying on kafka-ui's own context-path
      # awareness — don't silently reach for that without confirming the smoke test actually
      # failed first.
      - SERVER_SERVLET_CONTEXT_PATH=/admin/kafka-ui
    # No host port publish (was "8080:8080") — see docs/planning/02-admin-dashboard-plan.md,
    # Decision 4 (same reasoning applied to Grafana's port in devops/observability/
    # docker-compose.yml): reachable only through the Gateway's admin-gated reverse proxy now — a
    # direct host port would let anyone bypass that gate, making "admin-only" an in-app
    # convenience instead of a real boundary. Accepted tradeoff: no more direct localhost:8080
    # access for local debugging.
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - askmycrawl

services:
  query-answer:
    extends:
      file: ../common.yml
      service: _defaults
    build:
      context: ../../backend
      dockerfile: apps/query-answer/Dockerfile
    # backend/.env (localhost defaults) is inherited from common.yml's `_defaults` service via
    # `extends:` above — see its comment. ../docker.env layers the container-network overrides
    # this service shares with others (VECTOR_DB_URL, EMBEDDING_BASE_URL, KAFKA_BROKERS,
    # OTEL_EXPORTER_OTLP_ENDPOINT, ...) on top. LLM_BASE_URL isn't shared with any other service
    # (only Query/Answer has an LLM_BASE_URL var at all) and OTEL_SERVICE_NAME must stay unique, so
    # both stay here.
    env_file:
      - ../docker.env
    environment:
      - LLM_BASE_URL=http://host.docker.internal:1234/v1 # same local LM Studio instance; swappable to a hosted OpenAI-compatible provider via env only
      - OTEL_SERVICE_NAME=query-answer
    # No ports: — Kafka-only microservice, no HTTP surface.
    extra_hosts:
      - "host.docker.internal:host-gateway" # for Linux Docker hosts; no-op on Docker Desktop
    depends_on:
      kafka:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - askmycrawl
      - observability

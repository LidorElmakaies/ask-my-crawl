# App stack (as opposed to devops/observability/docker-compose.yml, the telemetry stack).
# Kept as a separate compose project, joined via the shared `askmycrawl` network below, so the
# two can be brought up independently or together.
#
# Split into one file per logical unit under devops/<unit>/docker-compose.yml, pulled together here
# via the `include:` top-level key (Compose Specification, stable since v2.20) — this file itself
# only lists what to include, plus the shared networks. `docker compose up -d --build` from `devops/`
# still works exactly as documented in CLAUDE.md — `include:` is transparent to the CLI, nothing about
# the bring-up sequence changes. Shared restart policy/logging driver live in `common.yml`, borrowed
# per-service via `extends:` — not YAML anchors, which only resolve within a single YAML document and
# can't cross the per-service files below.
#
# `postgres`, `gateway`, `auth`, `job-manager`, `frontend`, `kafka` (broker + topic init + UI),
# `redis`, `seaweedfs`, `scraper`, `indexer`, and `qdrant` exist today — see docs/specs/services.md
# for the remaining two backend services (Query/Answer, Notification). Add each one here (its own
# Dockerfile under backend/apps/<service>/, its own devops/<service>/docker-compose.yml, its own
# `include:` line below) as it gets built — see the `devops` agent (.claude/agents/devops.md) for
# the full target shape, including its "reuse existing shared infrastructure" rule (a new service
# points at an existing Redis/SeaweedFS/Postgres/Kafka instance, it doesn't get its own). Job
# Manager Service (2026-08-28) is Kafka's first real producer/consumer; the Scraper (2026-08-28,
# docs/planning/03-crawler-scraper-indexing-plan.md) is Redis/SeaweedFS's first; the Indexer
# (backend/apps/indexer) is Qdrant's first (and only, so far) service definition — Qdrant itself is
# the one genuinely new piece of shared infrastructure here, not reused from an existing instance,
# since nothing else in this stack needed a vector DB before now (originally built against Milvus, a
# heavier 3-container topology, then migrated to Qdrant's single-container one — see
# docs/planning/03-crawler-scraper-indexing-plan.md §7).

include:
  - path: postgres/docker-compose.yml
  - path: gateway/docker-compose.yml
  - path: auth/docker-compose.yml
  - path: job-manager/docker-compose.yml
  - path: frontend/docker-compose.yml
  - path: kafka/docker-compose.yml
  - path: redis/docker-compose.yml
  - path: seaweedfs/docker-compose.yml
  - path: scraper/docker-compose.yml
  - path: qdrant/docker-compose.yml
  - path: indexer/docker-compose.yml

networks:
  askmycrawl:            # internal service-to-service (Postgres, and the services themselves)
    driver: bridge

  # Owned by devops/observability/docker-compose.yml — referenced here, not created here, so
  # gateway/auth can reach `otel-collector:4317` by service name.
  #
  # ORDERING GOTCHA: an external network must already exist. If `devops/observability` has never
  # been started, `docker compose up` here fails with "network observability not found". Bring the
  # telemetry stack up first, every time, no tooling enforces this — see the `devops` agent:
  #     cd observability && docker compose --env-file ../.env up -d
  #     cd .. && docker compose up -d --build
  observability:
    external: true
    name: observability

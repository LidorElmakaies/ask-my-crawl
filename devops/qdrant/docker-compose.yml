# Self-hosted vector DB for the Indexer — see docs/specs/data-model.md and
# docs/planning/03-crawler-scraper-indexing-plan.md §7. Version pinned, never `:latest` — see
# devops.md.
#
# No curl/wget in the official image (deliberate upstream, see
# github.com/qdrant/qdrant/issues/4250) — healthcheck uses Qdrant's own documented /dev/tcp
# workaround instead.
services:
  qdrant:
    extends:
      file: ../common.yml
      service: _defaults
    image: qdrant/qdrant:v1.19.0
    volumes:
      - ../data/qdrant:/qdrant/storage
    ports:
      - "6333:6333" # REST — host debugging only; in-network services use qdrant:6333
      - "6334:6334" # gRPC — same
    networks:
      - askmycrawl
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

# Self-hosted vector DB for the Indexer (docs/specs/data-model.md's "Owned by the Scraper and the
# Indexer" section — HNSW/COSINE, not pgvector). Replaced Milvus (a real 3-container etcd+MinIO+
# standalone topology) — Qdrant needs no external metadata/object-storage services of its own, so
# this is genuinely one container, not an adapted multi-service one. Version pinned directly from
# Qdrant's own currently-published stable tag (never `:latest` — see devops.md's Tempo incident for
# why that's non-negotiable here).
#
# No `curl`/`wget` in the official image (a deliberate security choice upstream, not an oversight —
# github.com/qdrant/qdrant/issues/4250), so the usual `curl -f http://.../healthz` pattern used
# elsewhere in this stack doesn't work here. The `/dev/tcp` bash redirection below is Qdrant's own
# documented workaround (their own reference compose file uses the identical command) — bash is
# present in the image's debian-slim base even though curl/wget deliberately aren't.
services:
  qdrant:
    extends:
      file: ../common.yml
      service: _defaults
    image: qdrant/qdrant:v1.19.0
    volumes:
      - ../data/qdrant:/qdrant/storage
    ports:
      - "6333:6333" # REST API — host debugging only; in-network services use qdrant:6333
      - "6334:6334" # gRPC API — same, host debugging only
    networks:
      - askmycrawl
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

services:
  gateway:
    extends:
      file: ../common.yml
      service: _defaults
    build:
      context: ../../backend
      dockerfile: apps/gateway/Dockerfile
    # backend/.env (localhost defaults) is inherited from common.yml's `_defaults` service via
    # `extends:` above — see its comment. ../docker.env layers the container-network overrides
    # this service shares with others (KAFKA_BROKERS, OTEL_EXPORTER_OTLP_ENDPOINT, ...) on top.
    # AUTH_SERVICE_URL/JOB_MANAGER_URL/GRAFANA_URL/KAFKA_UI_URL/OTEL_SERVICE_NAME are Gateway-only
    # (no code fallback for any of them, see docs/planning/01-architecture-notes.md), so they stay
    # here rather than in the shared file.
    env_file:
      - ../docker.env
    environment:
      - AUTH_SERVICE_URL=http://auth:8001 # Gateway proxies /auth/*, /me, /admin/users* to it
      - JOB_MANAGER_URL=http://job-manager:8002 # jobs-proxy's GET /jobs* forward target
      # tool-proxy's admin-gated reverse-proxy targets (docs/planning/02-admin-dashboard-plan.md)
      - GRAFANA_URL=http://grafana:3000
      - KAFKA_UI_URL=http://kafka-ui:8080
      - OTEL_SERVICE_NAME=gateway
    ports:
      - "8000:8000"
    networks:
      - askmycrawl
      - observability

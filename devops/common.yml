# Shared service defaults — restart policy + logging driver, borrowed via `extends:` (not YAML
# anchors: those only resolve within a single YAML document, which breaks once config is split
# across the per-service files under devops/<unit>/). `_defaults` is never listed in the root
# docker-compose.yml's `include:`, so it never runs as a container of its own — every real service
# pulls from it via `extends:` and layers its own image/build/ports/environment/networks on top.
#
# `networks:` is deliberately NOT here — gateway/auth need `[askmycrawl, observability]`, everything
# else needs just `[askmycrawl]`, so that stays per-service rather than forcing a false uniform value.
#
# `env_file` IS here — every real service needs backend/.env's local-dev defaults, so it's loaded
# once for all of them via `extends:` instead of a repeated line in each devops/<unit>/docker-
# compose.yml. Verified empirically that `extends:` actually merges a base service's `env_file`
# list into the extending service's (not just `environment:`/`volumes:`), and that relative paths
# here resolve against common.yml's own location (devops/), not the extending file's — hence
# `../backend/.env`, not the `../../backend/.env` each per-service file used before this existed.
# Each per-service file layers its own `env_file: - ../docker.env` (container-network overrides,
# shared by 2+ services) on top — later env_file entries win, so docker.env correctly overrides
# this file's localhost-based defaults; an `environment:` block still wins over both when a service
# needs a value nothing else shares (e.g. OTEL_SERVICE_NAME, which must differ per service).
services:
  _defaults:
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - ../backend/.env
